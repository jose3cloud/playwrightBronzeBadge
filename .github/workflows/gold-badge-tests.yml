name: Gold Badge Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  gold-tests:
    name: Gold Badge (smoke gate + full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Quality gate: fail the build early on critical/smoke failures
      - name: Quality gate — smoke (@smoke on Chromium)
        run: npm run test:gold:smoke
        env:
          CI: true

      # Parallel across Chromium / Firefox / WebKit via Playwright projects
      - name: Run Gold Badge tests (all browsers)
        run: npm run test:gold
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gold-test-results
          path: test-results/
          retention-days: 7
