name: Gold Badge Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  gold-tests:
    name: Gold Badge (all browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Browsers + OS deps preinstalled — no install-deps / playwright install steps
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    env:
      # Required for Firefox in the Playwright container on GHA
      HOME: /root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Gold Badge tests (Chromium, Firefox, WebKit)
        run: npm run test:gold
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gold-test-results
          path: test-results/
          retention-days: 7
