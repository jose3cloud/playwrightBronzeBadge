name: Gold Badge Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  gold-tests:
    name: Gold Badge (smoke gate + full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Browsers + OS deps preinstalled — no install-deps / playwright install steps
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Quality gate — smoke (@smoke on Chromium)
        run: npm run test:gold:smoke
        env:
          CI: true

      - name: Run Gold Badge tests (all browsers)
        run: npm run test:gold
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts (screenshots, videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gold-test-results
          path: test-results/
          retention-days: 7
